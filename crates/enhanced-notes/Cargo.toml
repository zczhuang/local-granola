[package]
name = "enhanced-notes"
version = "0.1.0"
edition = "2024"

# Pure (no I/O) engine for Granola-style "enhanced notes": the user's typed
# notes stay verbatim as the skeleton and a local LLM adds source-linked AI
# bullets underneath. The optional `ollama` feature adds a loopback-only client.
[features]
default = []
ollama = ["dep:reqwest"]

[dependencies]
anlg-tiptap = { workspace = true }

reqwest = { workspace = true, optional = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }
