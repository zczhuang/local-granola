[package]
name = "calendar"
version = "0.1.0"
edition = "2024"

[features]
specta = ["dep:specta"]

[dependencies]
anlg-api-client = { workspace = true }
anlg-apple-calendar = { workspace = true, features = ["specta"] }
anlg-calendar-interface = { workspace = true }
anlg-google-calendar = { workspace = true, features = ["specta"] }
anlg-outlook-calendar = { workspace = true, features = ["specta"] }

base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
open = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "form"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true, features = ["chrono"], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time"] }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }
